<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin login')}"></head>
<body class="center"><form class="card" method="post" th:action="@{/admin/login}"><h2>🛡 CodeGuard</h2>
