spring.application.name=codeguard
# Default: embedded H2 file DB (zero setup). Use --spring.profiles.active=mysql for MySQL.
spring.datasource.url=jdbc:h2:file:./data/codeguard;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
codeguard.base-url=http://localhost:8080
codeguard.storage=./data/recordings
codeguard.admin.username=admin
codeguard.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
